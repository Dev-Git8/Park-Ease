services:
  api:
    build: .
    container_name: parking-api
    restart: always
    ports:
      - "127.0.0.1:5000:5000"
    env_file: .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    container_name: parking-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ParkingDB
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: parking-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: always

volumes:
  pgdata:
