name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'Backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/parking_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_test_jwt_secret
      REFRESH_TOKEN_SECRET: ci_test_refresh_secret
      NODE_ENV: test
      RAZORPAY_KEY_ID: rzp_test_ci_placeholder
      RAZORPAY_KEY_SECRET: ci_test_razorpay_key_secret
      RAZORPAY_WEBHOOK_SECRET: ci_test_razorpay_webhook_secret
      CLOUDINARY_URL: cloudinary://placeholder:placeholder@placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
