# Nginx reverse proxy for the parking API on EC2.
#
# Setup:
#   1. Replace api.yourdomain.com below with your real domain/subdomain.
#   2. sudo cp deploy/nginx.parking-api.conf /etc/nginx/sites-available/parking-api
#   3. sudo ln -s /etc/nginx/sites-available/parking-api /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. sudo certbot --nginx -d api.yourdomain.com   (rewrites this file to add TLS)

server {
    listen 80;
    server_name api.yourdomain.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:5000;

        # Required for Socket.IO's WebSocket upgrade.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
